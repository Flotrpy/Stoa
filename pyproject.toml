[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "stoa-platform"
version = "0.1.0"
description = "Safety-first unified team security platform"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Proprietary"}
authors = [{name = "Flotrpy", email = "affanshaik2009@gmail.com"}]
dependencies = [
  "alembic==1.20.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "keyring==25.7.0",
  "platformdirs==4.12.0",
  "psycopg[binary]==3.3.6",
  "pydantic-settings==2.10.1",
  "pydantic==2.11.7",
  "PySide6==6.9.2",
  "pwdlib[argon2]==0.3.1",
  "PyJWT==2.15.0",
  "scapy==2.7.0",
  "scikit-learn==1.9.1",
  "SQLAlchemy==2.0.54",
  "starlette==1.3.1",
  "uvicorn[standard]==0.35.0",
  "websockets==17.1"
]

[project.optional-dependencies]
dev = [
  "bandit[toml]==1.8.6",
  "build==1.3.0",
  "mypy==1.17.1",
  "pip-audit==2.9.0",
  "pytest-asyncio==1.4.0",
  "pytest-cov==6.2.1",
  "pytest==9.1.1",
  "ruff==0.12.8"
]

[project.scripts]
stoa = "stoa_desktop.__main__:main"
stoa-api = "stoa_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = [
  "src/stoa_desktop",
  "src/stoa_server",
  "src/stoa_shared",
  "src/stoa_workers",
  "src/stoa_security",
  "src/stoa_platform"
]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=src --cov-report=term-missing --cov-fail-under=75"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["stoa_desktop", "stoa_server", "stoa_shared", "stoa_workers", "stoa_security", "stoa_platform"]
plugins = ["sqlalchemy.ext.mypy.plugin"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_empty = true
